[package]
name = "bee-rs"
version = "1.7.0"
edition = "2024"
rust-version = "1.85"
description = "Rust client for the Swarm Bee API. Functional parity with bee-js / bee-go."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ethswarm-tools/bee-rs"
readme = "README.md"
keywords = ["swarm", "bee", "ethereum", "storage"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
name = "bee"
path = "src/lib.rs"

[dependencies]
# HTTP + async runtime
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
bytes = "1"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto / encoding
secp256k1 = { version = "0.30", features = ["recovery", "global-context"] }
sha3 = "0.10"            # keccak256
hex = "0.4"
base64 = "0.22"
rand_core = { version = "0.6", features = ["std"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"

# Error / logging
thiserror = "2"
tracing = "0.1"

# Big number math (BZZ / DAI)
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"

# URL handling
url = "2"

# Tar (collection uploads)
tar = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
hex-literal = "0.4"
anyhow = "1"
tempfile = "3"
rand = "0.8"
# For the swarm-keyring example only.
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false, features = ["std"] }
# Bench-only — comparison harness for the keccak/ECDSA backends.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tiny-keccak = { version = "2", features = ["keccak"] }

[[bench]]
name = "hashing"
harness = false

[features]
default = []
# Reserved for future opt-in subsystems (e.g. dev-mode helpers, wasm targets).
